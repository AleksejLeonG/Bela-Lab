[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bela-engine"
dynamic = ["version"]
description = "Engine for the agreed Croatian four-player Bela variant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]

[project.scripts]
bela = "bela.interfaces.simulator_cli:main"
bela-track = "bela.interfaces.player_cli:main"
bela-desktop = "bela.interfaces.desktop:main"
bela-dashboard = "bela.interfaces.dashboard:main"
bela-batch = "bela.interfaces.batch_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bela.__version__"}

[tool.setuptools.package-data]
"bela.interfaces" = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.json", "web/cards/*.svg", "web/cards/hungarian/*.svg", "web/cards/hungarian-illustrated/*.webp"]
