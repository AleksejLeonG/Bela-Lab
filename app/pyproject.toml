[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bela-engine"
version = "0.5.0"
description = "Engine for the agreed Croatian four-player Bela variant"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bela = "bela.interfaces.simulator_cli:main"
bela-track = "bela.interfaces.player_cli:main"
bela-dashboard = "bela.interfaces.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bela.interfaces" = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.json"]
